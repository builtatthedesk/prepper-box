# Landing page + map files + original PDFs, and the geocoder (/geocode/ -> photon) and notice board
# (/board/) proxied on the same origin, so they need no second port.
limit_conn_zone $binary_remote_addr zone=board:1m;   # per-client cap on /board/ connections

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Captive-portal probes from phones on the hotspot (all DNS there points here): send them to
    # the start page so the OS pops it up on join. Never reached from the home LAN.
    location ~ ^/(generate_204|gen_204|hotspot-detect\.html|library/test/success\.html|connecttest\.txt|ncsi\.txt|redirect|canonical\.html|success\.txt)$ {
        return 302 http://10.42.0.1/;
    }

    # Resolve at request time via Docker DNS, so nginx (and the whole start page) still starts
    # when the geocoder container is down.
    resolver 127.0.0.11 valid=30s;
    location /geocode/ {
        set $geo http://geocoder:2322;
        rewrite ^/geocode/(.*)$ /$1 break;
        proxy_pass $geo;
        proxy_read_timeout 30s;
    }
    # Driving directions (Valhalla, tiles built off-box by get-routing.sh). Only the route API.
    location = /route/route {
        set $route http://routing:8002;
        rewrite ^ /route break;
        proxy_pass $route;
        proxy_read_timeout 30s;
    }
    location = /board { return 301 /board/; }
    location /board/ {
        set $board http://board:8000;
        rewrite ^/board/(.*)$ /$1 break;
        proxy_pass $board;
        client_max_body_size 51m;          # app caps files at 50 MB
        client_body_timeout 15s;           # a drip-fed upload is dropped instead of tying up workers
        limit_conn board 4;
        proxy_request_buffering off;       # stream uploads straight to the app
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
