# DHCP + DNS for hotspot clients only (never on the wired port). Every name resolves to this box, so
# phones see a captive portal and pop up the start page. No internet is routed.
interface=__IF__
bind-interfaces
except-interface=lo
no-resolv
dhcp-range=10.42.0.50,10.42.0.250,255.255.255.0,12h
dhcp-option=option:router,10.42.0.1
dhcp-option=option:dns-server,10.42.0.1
domain=lan
address=/#/10.42.0.1
