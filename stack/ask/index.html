<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the Library</title>
<style>
  :root { --bg:#f6f5f1; --fg:#1d1d1b; --muted:#5d5b55; --card:#fff; --line:#dedbd2; --accent:#2f6b3a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161714; --fg:#ecebe6; --muted:#a8a69e; --card:#20221e; --line:#34372f; --accent:#7cc38a; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:28px 16px; }
  h1 { margin:0 0 4px; font-size:26px } p.sub { margin:0 0 20px; color:var(--muted) }
  form { display:flex; gap:8px } input { flex:1; min-width:0; padding:12px; font:inherit; border:1px solid var(--line);
         border-radius:8px; background:var(--card); color:inherit } button { padding:12px 18px; font:inherit; border:0;
         border-radius:8px; background:var(--accent); color:#fff; cursor:pointer } button:disabled { opacity:.5 }
  #status { color:var(--muted); margin:16px 0 6px; min-height:1.5em }
  #answer { white-space:pre-wrap; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; display:none }
  ol { padding-left:22px } ol a { color:var(--accent) } small { color:var(--muted) }
  a.back { color:var(--muted); font-size:14px }
</style>
</head>
<body>
<main>
  <a class="back" href="/">&larr; Home</a>
  <h1>Ask the Library</h1>
  <p class="sub">Searches the offline library, then a small AI answers from what it found. Always check the sources. It runs on a small computer, so an answer takes about a minute.</p>
  <form id="f"><input id="q" placeholder="e.g. how do I treat a burn?" autocomplete="off" autofocus><button id="b">Ask</button></form>
  <div id="status"></div>
  <div id="answer"></div>
  <ol id="src"></ol>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const f = $("f"), b = $("b"), answer = $("answer"), src = $("src"), status = $("status");
  const lib = "http://" + location.hostname + ":8080";
  document.querySelector(".back").href = "http://" + location.hostname + "/";
  f.onsubmit = async (e) => {
    e.preventDefault();
    const q = document.getElementById("q").value.trim(); if (!q) return;
    b.disabled = true; answer.style.display = "none"; answer.textContent = ""; src.innerHTML = "";
    status.textContent = "Searching the library and reading articles…";
    const t0 = Date.now();
    try {
      const r = await fetch("api", { method: "POST", body: JSON.stringify({ q }) });
      const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "", head = true;
      for (;;) {
        const { value, done } = await rd.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        if (head) {
          const nl = buf.indexOf("\n"); if (nl < 0) continue;
          const { sources } = JSON.parse(buf.slice(0, nl)); buf = buf.slice(nl + 1); head = false;
          sources.forEach((s, i) => { const li = document.createElement("li");
            li.innerHTML = `<a target="_blank"></a> <small></small>`; li.firstChild.href = lib + s.link;
            li.firstChild.textContent = s.title; li.lastChild.textContent = "— " + s.book; src.appendChild(li); });
          status.textContent = "Thinking… (the AI is reading the excerpts)";
        }
        if (buf) { answer.style.display = "block"; answer.textContent += buf; buf = ""; status.textContent = "Answering…"; }
      }
      status.textContent = `Done in ${Math.round((Date.now() - t0) / 1000)} s. Sources below.`;
    } catch (err) { status.textContent = "Error: " + err; }
    b.disabled = false;
  };
</script>
</body>
</html>
